<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Gallery · Image Generation</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#strips">Skip to the runs</a>
<nav class="rail" aria-label="Projects">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span><span class="brand-name">Image Generation</span><span class="brand-sub">Gallery</span></span>
  </div>
  <ul id="sessions" class="sessions"></ul>
  <fieldset class="theme">
    <legend class="sr">Theme</legend>
    <label><input type="radio" name="theme" value="auto">Auto</label>
    <label><input type="radio" name="theme" value="light">Light</label>
    <label><input type="radio" name="theme" value="dark">Dark</label>
  </fieldset>
</nav>
<main id="strips" class="canvas" tabindex="-1">
  <h1 class="sr">Gallery</h1>
  <p class="top"><span id="here" class="here"></span><span id="run-count"></span><span id="connection" role="status" aria-live="polite"></span></p>
  <button id="fresh" class="fresh slab" type="button" hidden></button>
  <p id="empty" class="empty" hidden></p>
  <ol id="strip-list" class="strips"></ol>
</main>
<div id="loupe" class="loupe slab" role="dialog" aria-modal="true" aria-labelledby="loupe-print" tabindex="-1" hidden>
  <div id="loupe-actions" class="loupe-actions"></div>
  <figure class="loupe-frame">
    <img id="loupe-image" class="loupe-image" alt="">
    <figcaption class="loupe-caption">
      <p id="loupe-print" class="print"></p>
      <p id="loupe-note" class="note" aria-live="polite"></p>
      <p id="loupe-prompt" class="loupe-prompt"></p>
    </figcaption>
  </figure>
</div>
</body>
</html>
